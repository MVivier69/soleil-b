<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soleil Beaujolais</title>
<meta name="description" content="Application de l'association Soleil Beaujolais, énergie citoyenne en Beaujolais.">
<meta name="theme-color" content="#12C4EE">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./images/icone-192.png">
<link rel="apple-touch-icon" href="./images/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Soleil Beaujolais">

<style>
  :root{
    --principale:#12C4EE;
    --accent:#FAC800;
    --encre:#3F5570;
    --fond:#F2FAFD;
    --carte:#FFFFFF;
    --trait:rgba(63,85,112,.14);
    --ombre:0 1px 2px rgba(63,85,112,.06), 0 6px 18px rgba(63,85,112,.08);
    --rayon:14px;
    --gouttiere:12px;
  }

  *,*::before,*::after{box-sizing:border-box;}

  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--fond);
    color:var(--encre);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow-wrap:break-word;
  }

  img{display:block;max-width:100%;}

  a{color:inherit;text-decoration:none;}

  .page{
    max-width:560px;
    margin:0 auto;
    padding:0 var(--gouttiere) calc(28px + env(safe-area-inset-bottom));
  }

  /* ---------- bannière et identité ---------- */
  .banniere{
    display:block;
    margin:0 calc(-1 * var(--gouttiere));
    overflow:hidden;
    background:var(--principale);
  }
  .banniere img{width:100%;height:var(--hauteur-banniere,130px);object-fit:cover;}

  .identite{
    display:flex;align-items:center;gap:12px;
    padding:14px 2px 4px;
  }
  .identite img{width:46px;height:46px;border-radius:50%;flex:0 0 auto;}
  .identite .textes{min-width:0;}
  .identite h1{
    margin:0;font-size:1.32rem;line-height:1.15;font-weight:700;letter-spacing:-.01em;
  }
  .identite p{margin:2px 0 0;font-size:.82rem;opacity:.72;}

  /* ---------- titres de section ---------- */
  .titre-section{
    display:flex;align-items:center;gap:10px;
    margin:24px 2px 10px;
    font-size:.74rem;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--encre);opacity:.85;
  }
  .titre-section::after{
    content:"";flex:1 1 auto;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),transparent);
  }

  /* ---------- à la une ---------- */
  .alaune{
    display:flex;align-items:center;gap:14px;
    background:var(--carte);border-radius:var(--rayon);
    box-shadow:var(--ombre);
    padding:12px;
    border-left:5px solid var(--accent);
    transition:transform .15s ease;
  }
  .alaune img{width:78px;height:78px;flex:0 0 auto;border-radius:10px;object-fit:cover;}
  .alaune .libelle{min-width:0;font-size:1.06rem;font-weight:650;hyphens:auto;}
  .alaune .fleche{margin-left:auto;flex:0 0 auto;opacity:.45;}

  /* ---------- grilles ---------- */
  .grille{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }
  .grille-galerie{grid-template-columns:repeat(3,minmax(0,1fr));}

  /* espacement entre deux encarts larges empilés */
  .encart + .encart{margin-top:10px;}

  .pave{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    min-width:0;
    background:var(--carte);border-radius:var(--rayon);
    box-shadow:var(--ombre);
    padding:11px 6px 10px;
    text-align:center;
    transition:transform .15s ease;
  }
  .pave img{width:100%;max-width:74px;aspect-ratio:1/1;object-fit:contain;border-radius:9px;}
  .pave .libelle{
    min-width:0;width:100%;
    font-size:.8rem;font-weight:620;line-height:1.2;
    hyphens:auto;
  }

  .vignette{
    display:block;min-width:0;
    border-radius:11px;overflow:hidden;
    box-shadow:var(--ombre);background:var(--carte);
    transition:transform .15s ease;
  }
  .vignette img{width:100%;aspect-ratio:1/1;object-fit:cover;}
  .vignette .legende{
    display:block;padding:5px 4px 6px;
    font-size:.64rem;font-weight:600;line-height:1.15;text-align:center;
    hyphens:auto;
  }

  @media (hover:hover){
    .alaune:hover,.pave:hover,.vignette:hover{transform:translateY(-2px);}
  }

  /* ---------- infos pratiques ---------- */
  .infos{
    background:var(--carte);border-radius:var(--rayon);
    box-shadow:var(--ombre);overflow:hidden;
  }
  .info-ligne{
    display:flex;align-items:flex-start;gap:12px;
    padding:12px 13px;min-width:0;
  }
  .info-ligne + .info-ligne{border-top:1px solid var(--trait);}
  .info-ligne .picto{
    flex:0 0 auto;width:32px;height:32px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(18,196,238,.13);color:var(--principale);
  }
  .info-ligne .contenu{min-width:0;}
  .info-ligne .etiquette{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6;}
  .info-ligne .valeur{font-size:.95rem;font-weight:600;}
  .info-ligne .valeur span{display:block;font-weight:500;}

  /* ---------- liens ---------- */
  .liens{display:flex;flex-wrap:wrap;gap:8px;}
  .lien-puce{
    display:inline-flex;align-items:center;gap:6px;
    max-width:100%;min-width:0;
    padding:8px 13px;border-radius:999px;
    background:var(--carte);box-shadow:var(--ombre);
    font-size:.85rem;font-weight:600;
  }
  .lien-puce::before{
    content:"";flex:0 0 auto;width:7px;height:7px;border-radius:50%;
    background:var(--principale);
  }

  /* ---------- pied de page ---------- */
  .pied{
    margin-top:26px;padding-top:14px;
    border-top:1px solid var(--trait);
    text-align:center;font-size:.76rem;opacity:.6;
  }

  /* ---------- carte d'installation ---------- */
  .installation{
    position:sticky;z-index:20;
    margin:18px 0 0;
    background:var(--carte);
    border:1px solid var(--trait);
    border-radius:var(--rayon);
    box-shadow:0 8px 26px rgba(63,85,112,.16);
    padding:13px 14px;
  }
  .installation.en-bas{bottom:calc(10px + env(safe-area-inset-bottom));}
  .installation.en-haut{top:10px;}
  .installation h2{margin:0 0 4px;font-size:.98rem;font-weight:700;}
  .installation p{margin:0;font-size:.85rem;opacity:.8;}
  .installation .actions{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap;}
  .bouton{
    appearance:none;border:0;cursor:pointer;
    padding:9px 17px;border-radius:999px;
    background:var(--principale);color:#fff;
    font:inherit;font-size:.86rem;font-weight:700;
  }
  .bouton-discret{
    appearance:none;border:0;cursor:pointer;background:none;
    padding:9px 6px;font:inherit;font-size:.82rem;font-weight:600;
    color:var(--encre);opacity:.6;
  }
  .installation .etape{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;margin:6px 6px 0 0;border-radius:8px;
    background:rgba(18,196,238,.11);font-size:.8rem;font-weight:600;
  }

  /* ---------- accessibilité ---------- */
  a:focus-visible,button:focus-visible{
    outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }

  /* ---------- écrans très étroits ---------- */
  @media (max-width:359px){
    :root{--gouttiere:9px;}
    .grille{gap:8px;}
    .pave{padding:9px 4px 8px;}
    .pave .libelle{font-size:.74rem;}
    .vignette .legende{font-size:.6rem;}
  }
</style>
</head>

<body>
<div class="page" id="application"></div>

<script src="./config.js"></script>

<!-- ====================== DÉBUT DU MOTEUR ====================== -->
<script>
(function () {
  "use strict";

  var C = window.SB_CONFIG;
  var racine = document.getElementById("application");

  if (!C) {
    racine.textContent = "Le fichier config.js n'a pas pu être chargé.";
    return;
  }

  /* --- échappement : aucun texte de config.js ne peut casser la page ---
     Les espaces saisis dans config.js sont restitués tels quels : le HTML
     regroupe normalement les espaces consécutifs en un seul, on convertit
     donc les espaces de début, de fin et les groupes de deux ou plus en
     espaces insécables. Un espace simple entre deux mots reste un espace
     ordinaire, afin que les retours à la ligne se fassent normalement. */
  function ech(v) {
    return String(v === undefined || v === null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;")
      .replace(/^ +| {2,}| +$/g, function (m) {
        return new Array(m.length + 1).join("&#160;");
      });
  }
  function vrai(v) { return v !== false; }
  function texteNonVide(v) { return typeof v === "string" && v.trim() !== ""; }

  /* --- couleurs --- */
  var col = C.couleurs || {};
  var style = document.documentElement.style;
  if (col.principale) style.setProperty("--principale", col.principale);
  if (col.accent)     style.setProperty("--accent", col.accent);
  if (col.encre)      style.setProperty("--encre", col.encre);
  if (col.fond)       style.setProperty("--fond", col.fond);
  if (col.carte)      style.setProperty("--carte", col.carte);
  if (col.principale) {
    var balise = document.querySelector('meta[name="theme-color"]');
    if (balise) balise.setAttribute("content", col.principale);
  }

  var html = [];
  var ident = C.identite || {};

  if (texteNonVide(ident.nom)) document.title = ident.nom;

  /* ---------- bannière ---------- */
  var ban = C.banniere || {};
  if (vrai(ban.afficher) && texteNonVide(ban.image)) {
    if (ban.hauteur) style.setProperty("--hauteur-banniere", parseInt(ban.hauteur, 10) + "px");
    var img = '<img src="' + ech(ban.image) + '" alt="' + ech(ban.texteAlternatif || "") + '">';
    html.push(texteNonVide(ban.lien)
      ? '<a class="banniere" href="' + ech(ban.lien) + '" target="_blank" rel="noopener">' + img + "</a>"
      : '<div class="banniere">' + img + "</div>");
  }

  /* ---------- identité ---------- */
  if (texteNonVide(ident.nom)) {
    var bloc =
      (texteNonVide(ident.logo) ? '<img src="' + ech(ident.logo) + '" alt="">' : "") +
      '<div class="textes"><h1>' + ech(ident.nom) + "</h1>" +
      (texteNonVide(ident.baseline) ? "<p>" + ech(ident.baseline) + "</p>" : "") +
      "</div>";
    html.push(texteNonVide(ident.lienLogo)
      ? '<a class="identite" href="' + ech(ident.lienLogo) + '" target="_blank" rel="noopener">' + bloc + "</a>"
      : '<div class="identite">' + bloc + "</div>");
  }

  function titre(t) {
    return texteNonVide(t) ? '<h2 class="titre-section">' + ech(t) + "</h2>" : "";
  }

  /* ---------- encart large : sert à « À la une » et à « Watts News » ---------- */
  function encart(item) {
    if (!item || !vrai(item.afficher) || !texteNonVide(item.texte)) return "";
    var interieur =
      (texteNonVide(item.image) ? '<img src="' + ech(item.image) + '" alt="">' : "") +
      '<span class="libelle">' + ech(item.texte) + "</span>" +
      '<svg class="fleche" width="18" height="18" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ' +
      'aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
    return texteNonVide(item.lien)
      ? '<a class="alaune encart" href="' + ech(item.lien) + '" target="_blank" rel="noopener">' + interieur + "</a>"
      : '<div class="alaune encart">' + interieur + "</div>";
  }

  /* ---------- à la une ---------- */
  var une = C.alaune || {};
  if (vrai(une.afficher)) {
    var carteUne = encart(une);
    if (carteUne) {
      html.push(titre(une.titreSection));
      html.push(carteUne);
    }
  }

  /* ---------- pavés ---------- */
  var pv = C.paves || {};
  if (vrai(pv.afficher) && Array.isArray(pv.liste) && pv.liste.length) {
    html.push(titre(pv.titreSection));
    var cases = pv.liste.filter(function (p) { return p && vrai(p.afficher); }).map(function (p) {
      var dedans =
        (texteNonVide(p.image) ? '<img src="' + ech(p.image) + '" alt="">' : "") +
        '<span class="libelle">' + ech(p.texte) + "</span>";
      return texteNonVide(p.lien)
        ? '<a class="pave" href="' + ech(p.lien) + '" target="_blank" rel="noopener">' + dedans + "</a>"
        : '<div class="pave">' + dedans + "</div>";
    }).join("");
    html.push('<div class="grille">' + cases + "</div>");
  }

  /* ---------- galerie ---------- */
  var ga = C.galerie || {};
  if (vrai(ga.afficher) && Array.isArray(ga.liste) && ga.liste.length) {
    html.push(titre(ga.titreSection));
    var vignettes = ga.liste.filter(function (p) { return p && vrai(p.afficher); }).map(function (p) {
      var dedans =
        (texteNonVide(p.image) ? '<img src="' + ech(p.image) + '" alt="' + ech(p.legende || "") + '">' : "") +
        (texteNonVide(p.legende) ? '<span class="legende">' + ech(p.legende) + "</span>" : "");
      return texteNonVide(p.lien)
        ? '<a class="vignette" href="' + ech(p.lien) + '" target="_blank" rel="noopener">' + dedans + "</a>"
        : '<div class="vignette">' + dedans + "</div>";
    }).join("");
    html.push('<div class="grille grille-galerie">' + vignettes + "</div>");
  }

  /* ---------- watts news ---------- */
  var wn = C.wattsnews || {};
  if (vrai(wn.afficher) && Array.isArray(wn.liste) && wn.liste.length) {
    var cartesWn = wn.liste.map(encart).join("");
    if (cartesWn) {
      html.push(titre(wn.titreSection));
      html.push(cartesWn);
    }
  }

  /* ---------- infos pratiques ---------- */
  var inf = C.infos || {};
  if (vrai(inf.afficher)) {
    var lignes = [];

    function ligne(picto, lien, etiquette, valeurHtml) {
      var dedans =
        '<span class="picto" aria-hidden="true">' + picto + "</span>" +
        '<span class="contenu"><span class="etiquette">' + ech(etiquette) + "</span>" +
        '<span class="valeur">' + valeurHtml + "</span></span>";
      return lien
        ? '<a class="info-ligne" href="' + ech(lien) + '" target="_blank" rel="noopener">' + dedans + "</a>"
        : '<div class="info-ligne">' + dedans + "</div>";
    }

    var svg = {
      lieu: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/></svg>',
      tel:  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.2a2 2 0 012.1-.5c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>',
      mail: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 7l9 6 9-6"/></svg>'
    };

    var ad = inf.adresse || {};
    if (vrai(ad.afficher) && Array.isArray(ad.lignes) && ad.lignes.length) {
      var texteAdresse = [ad.intitule].concat(ad.lignes).filter(texteNonVide).join(", ");
      var valeur = (texteNonVide(ad.intitule) ? ech(ad.intitule) : "") +
        ad.lignes.filter(texteNonVide).map(function (l) { return "<span>" + ech(l) + "</span>"; }).join("");
      lignes.push(ligne(svg.lieu,
        "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(texteAdresse),
        "Adresse", valeur));
    }

    var te = inf.telephone || {};
    if (vrai(te.afficher) && texteNonVide(te.numero)) {
      /* le lien d'appel ne garde que les chiffres : les espaces de mise en
         forme saisis dans config.js ne peuvent donc pas le perturber */
      var brut = te.numero.replace(/[^0-9+]/g, "");
      lignes.push(ligne(svg.tel, "tel:" + brut, "Téléphone",
        (texteNonVide(te.intitule)
          ? ech(te.intitule) + "<span>" + ech(te.numero) + "</span>"
          : ech(te.numero))));
    }

    var ma = inf.mail || {};
    if (vrai(ma.afficher) && texteNonVide(ma.adresse)) {
      /* même précaution : l'adresse est débarrassée de ses espaces
         de mise en forme avant d'être placée dans le lien mailto: */
      lignes.push(ligne(svg.mail, "mailto:" + ma.adresse.replace(/\s+/g, ""),
        "Courriel", ech(ma.adresse)));
    }

    if (lignes.length) {
      html.push(titre(inf.titreSection));
      html.push('<div class="infos">' + lignes.join("") + "</div>");
    }
  }

  /* ---------- liens ---------- */
  var li = C.liens || {};
  if (vrai(li.afficher) && Array.isArray(li.liste)) {
    var puces = li.liste.filter(function (l) {
      return l && vrai(l.afficher) && texteNonVide(l.texte) && texteNonVide(l.lien);
    }).map(function (l) {
      return '<a class="lien-puce" href="' + ech(l.lien) + '" target="_blank" rel="noopener">' +
             ech(l.texte) + "</a>";
    }).join("");
    if (puces) {
      html.push(titre(li.titreSection));
      html.push('<div class="liens">' + puces + "</div>");
    }
  }

  /* ---------- emplacement de la carte d'installation ---------- */
  var inst = C.installation || {};
  var enHaut = inst.position === "haut";
  var marqueur = '<div id="zone-installation"></div>';
  if (enHaut) html.splice(2, 0, marqueur); else html.push(marqueur);

  /* ---------- pied de page ---------- */
  var pd = C.piedDePage || {};
  if (vrai(pd.afficher) && texteNonVide(pd.texte)) {
    html.push('<div class="pied">' + (texteNonVide(pd.lien)
      ? '<a href="' + ech(pd.lien) + '" target="_blank" rel="noopener">' + ech(pd.texte) + "</a>"
      : ech(pd.texte)) + "</div>");
  }

  racine.innerHTML = html.join("");

  /* =====================================================================
     CARTE D'INSTALLATION — contextuelle
     Elle n'apparaît que si l'installation peut réellement aboutir.
     ===================================================================== */
  (function () {
    var zone = document.getElementById("zone-installation");
    if (!zone || !vrai(inst.afficher)) return;

    var ua = navigator.userAgent || "";
    var estIOS = /iPad|iPhone|iPod/.test(ua) ||
                 (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var estSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
    var estNavigateurIntegre = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Twitter/.test(ua);

    var deja = false;
    try {
      deja = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
             window.navigator.standalone === true;
    } catch (e) { deja = false; }
    if (deja) return;

    var cle = "sb-installation-fermee";
    var repere = String(inst.titre || "");
    if (vrai(inst.permettreFermeture)) {
      try { if (window.localStorage.getItem(cle) === repere) return; } catch (e) {}
    }

    var invite = null;
    var affichee = false;

    function fermer() {
      try { if (vrai(inst.permettreFermeture)) window.localStorage.setItem(cle, repere); } catch (e) {}
      zone.innerHTML = "";
    }

    function dessiner(corps) {
      if (affichee) return;
      affichee = true;
      zone.innerHTML =
        '<section class="installation ' + (enHaut ? "en-haut" : "en-bas") + '">' +
          "<h2>" + ech(inst.titre || "Installer l'application") + "</h2>" +
          (texteNonVide(inst.texte) ? "<p>" + ech(inst.texte) + "</p>" : "") +
          corps +
        "</section>";
      var bouton = zone.querySelector("[data-installer]");
      if (bouton) bouton.addEventListener("click", function () {
        if (!invite) return;
        invite.prompt();
        invite.userChoice.then(function () { invite = null; zone.innerHTML = ""; });
      });
      var croix = zone.querySelector("[data-fermer]");
      if (croix) croix.addEventListener("click", fermer);
    }

    var fermeture = vrai(inst.permettreFermeture)
      ? '<button class="bouton-discret" data-fermer type="button">Plus tard</button>' : "";

    /* Android / Chrome : invite système disponible */
    window.addEventListener("beforeinstallprompt", function (ev) {
      ev.preventDefault();
      invite = ev;
      dessiner('<div class="actions">' +
        '<button class="bouton" data-installer type="button">' +
        ech(inst.libelleBouton || "Installer") + "</button>" + fermeture + "</div>");
    });

    /* iPhone / iPad sous Safari : marche à suivre manuelle */
    if (estIOS && estSafari && !estNavigateurIntegre) {
      dessiner(
        '<div><span class="etape">1. Partager ' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M12 16V3"/><path d="M8 7l4-4 4 4"/>' +
        '<path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></span>' +
        '<span class="etape">2. Sur l\'écran d\'accueil</span></div>' +
        (fermeture ? '<div class="actions">' + fermeture + "</div>" : ""));
    }

    /* Navigateur intégré Facebook / Instagram : l'installation ne peut aboutir */
    else if (estNavigateurIntegre) {
      dessiner(
        '<div><span class="etape">Ouvrir cette page dans ' +
        (estIOS ? "Safari" : "Chrome") + "</span></div>" +
        (fermeture ? '<div class="actions">' + fermeture + "</div>" : ""));
    }

    window.addEventListener("appinstalled", function () { zone.innerHTML = ""; });
  })();

  /* ---------- service worker ---------- */
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
